[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laundry-ops-autopilot"
version = "0.1.0"
description = "Autonomous support, remediation, fleet-health and partner-settlement platform for shared-laundry operators (WeWash-style IoT boxes, Mollie-style payments)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar P" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langgraph>=0.2",
  "openai>=1.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
laundryops = "laundryops.cli:main"

[tool.setuptools.packages.find]
include = ["laundryops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
