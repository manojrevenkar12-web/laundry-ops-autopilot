name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Policy eval gate (500 labelled tickets, offline triage)
        run: python -m laundryops.cli eval --n 500 --seed 42 --gate --out evals/ci
      - name: Robustness eval (text noise)
        run: python -m laundryops.cli eval --n 500 --seed 42 --noise 0.5 --out evals/ci
      - uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/ci
